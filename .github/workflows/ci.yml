name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libavahi-client-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdrm-dev \
            libswscale-dev \
            ninja-build \
            pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.2
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtshadertools
          cache: true

      - name: Configure server tests
        run: >
          cmake -S server -B build/server -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build and run server tests
        run: |
          cmake --build build/server --target \
            test_commandparser \
            test_packets \
            test_jitterbuffer \
            test_drmformat \
            test_socket \
            --parallel
          ctest --test-dir build/server --output-on-failure

      - name: Configure client tests
        run: >
          cmake -S client -B build/client -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DANDROID_MULTI_MODE=OFF

      - name: Build and run client tests
        run: |
          cmake --build build/client --target test_socket --parallel
          ctest --test-dir build/client --output-on-failure
